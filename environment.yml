# Conda environment for osml-imagery-io development
# Create: conda env create -f environment.yml
# Activate: conda activate osml-io
# Update: conda env update -f environment.yml

name: osml-imagery-io-dev
channels:
  - conda-forge
  - defaults

dependencies:
  # Python version (3.12 required for pyo3 0.22+)
  - python=3.12

  # Core dependencies
  - numpy>=1.20

  # Native libraries for image codec support
  - openjpeg>=2.5  # JPEG 2000 codec (libopenjp2)

  # Build tools (maturin from conda-forge — needed before `maturin develop`)
  - maturin>=1.7
  - pip

  # Documentation (conda-forge builds; not in the `docs` extra's pip form)
  - sphinx>=7.0
  - myst-parser>=2.0
  - sphinx-autodoc-typehints
  - sphinxcontrib-mermaid
  - furo

  # Rust toolchain (optional - can also use system rustup)
  # Uncomment if you want conda to manage Rust:
  # - rust>=1.70

  # Test runners (conda-forge builds)
  - pytest>=7.0
  - pytest-cov>=4.0
  - pytest-benchmark>=4.0
  - pyyaml>=6.0
  - ruff>=0.1
  - hypothesis>=6.0

  # Feature dependencies come from the extras so their versions live in exactly
  # one place (pyproject.toml). Note pip rejects `--group` inside a requirements
  # file, which is what this block is, so the PEP 735 `dev` group cannot be
  # named here — the two test-only gates it adds are listed explicitly below.
  #
  # A missing gate does not fail the suite: pytest.importorskip makes it *skip*,
  # which still reports green over code that never ran. Keep this in sync with
  # the `test` group in pyproject.toml, and use `pytest -rs` to check nothing
  # skipped for a missing dependency.
  - pip:
      - -e .[zarr,virtualizarr]
      - xarray>=2024.1       # tests/property/zarr/test_v3_producer.py

variables:
  # Environment variables set when conda env is activated
  # PyO3 library path is handled by the setup script
  OSML_IO_ENV: "conda"
