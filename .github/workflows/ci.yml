name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  OPENJPEG_VERSION: "2.5.3"

jobs:
  # Fast checks — runs on every push/PR, current arch only
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install native deps
        run: |
          sudo apt-get update && sudo apt-get install -y cmake libjpeg-turbo8-dev libturbojpeg0-dev libtiff-dev
          curl -sL "https://github.com/uclouvain/openjpeg/archive/refs/tags/v${OPENJPEG_VERSION}.tar.gz" | tar xz
          cmake -S "openjpeg-${OPENJPEG_VERSION}" -B build-openjpeg \
            -DCMAKE_INSTALL_PREFIX=/usr/local -DBUILD_CODEC=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-openjpeg -j$(nproc)
          sudo cmake --install build-openjpeg
          sudo ldconfig
      - run: cargo fmt --check
      - run: cargo clippy --lib --tests -- -W warnings -A clippy::approx_constant

  # Static analysis — license compliance, unused deps, complexity metrics
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native deps
        run: |
          sudo apt-get update && sudo apt-get install -y cmake libjpeg-turbo8-dev libturbojpeg0-dev libtiff-dev
          curl -sL "https://github.com/uclouvain/openjpeg/archive/refs/tags/v${OPENJPEG_VERSION}.tar.gz" | tar xz
          cmake -S "openjpeg-${OPENJPEG_VERSION}" -B build-openjpeg \
            -DCMAKE_INSTALL_PREFIX=/usr/local -DBUILD_CODEC=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-openjpeg -j$(nproc)
          sudo cmake --install build-openjpeg
          sudo ldconfig
      - name: Install analysis tools
        run: |
          cargo install cargo-deny --locked
          cargo install cargo-machete --locked
      - name: cargo deny (licenses, advisories, bans)
        run: cargo deny check
      - name: cargo machete (unused dependencies)
        run: cargo machete

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python deps
        # The remote-IO tests use pyo3's auto-initialize to embed the runner's
        # system python3 and import fsspec at runtime. Install fsspec into that
        # same interpreter — do NOT add actions/setup-python, which puts a
        # relocated hostedtoolcache python on PATH whose stdlib the embedded
        # interpreter can't locate (init_fs_encoding failure).
        run: python3 -m pip install --break-system-packages fsspec
      - name: Install native deps
        run: |
          sudo apt-get update && sudo apt-get install -y cmake libjpeg-turbo8-dev libturbojpeg0-dev libtiff-dev
          curl -sL "https://github.com/uclouvain/openjpeg/archive/refs/tags/v${OPENJPEG_VERSION}.tar.gz" | tar xz
          cmake -S "openjpeg-${OPENJPEG_VERSION}" -B build-openjpeg \
            -DCMAKE_INSTALL_PREFIX=/usr/local -DBUILD_CODEC=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-openjpeg -j$(nproc)
          sudo cmake --install build-openjpeg
          sudo ldconfig
      - run: cargo test

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install native deps
        run: |
          sudo apt-get update && sudo apt-get install -y cmake libjpeg-turbo8-dev libturbojpeg0-dev libtiff-dev
          curl -sL "https://github.com/uclouvain/openjpeg/archive/refs/tags/v${OPENJPEG_VERSION}.tar.gz" | tar xz
          cmake -S "openjpeg-${OPENJPEG_VERSION}" -B build-openjpeg \
            -DCMAKE_INSTALL_PREFIX=/usr/local -DBUILD_CODEC=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-openjpeg -j$(nproc)
          sudo cmake --install build-openjpeg
          sudo ldconfig
      - name: Build and test
        run: |
          python -m venv .venv
          source .venv/bin/activate
          # PEP 735 `pip install --group` needs pip >= 25.1; the runner's venv
          # ships 25.0.1. maturin >= 1.13 auto-installs dependency groups during
          # `develop` by shelling out to `pip install --group`, so an un-upgraded
          # pip fails the build on the maturin step itself, before the explicit
          # install below is ever reached.
          python -m pip install --upgrade pip
          pip install maturin
          maturin develop --features extension-module,openjpeg,libjpeg-turbo,libtiff
          # Keep this explicit install even though `maturin develop` already
          # pulls the dev group: maturin's group install resolves the
          # `osml-imagery-io[zarr]` self-reference without picking up pyarrow,
          # and a missing pyarrow makes the Parquet tests skip rather than fail.
          #
          # The dev group pulls the zarr/virtualizarr extras and the test-only
          # gates (xarray). Do not name individual packages here: anything
          # missing makes importorskip skip its tests, which still reports green.
          pip install -e . --group dev
          # -rs lists every skip and its reason. Optional deps are gated by
          # pytest.importorskip, so a missing one skips rather than fails; the
          # skip list is what makes that visible in the log.
          pytest tests/unit tests/property -m "not integration and not benchmark" -rs

