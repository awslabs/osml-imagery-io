[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "osml-imagery-io"
version = "0.2.0"
description = "Geospatial image format codecs (NITF, GeoTIFF) for the OversightML ecosystem"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Amazon Web Services", email = "aws-osml-admin@amazon.com" },
]
keywords = ["geospatial", "nitf", "geotiff", "imagery", "remote-sensing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "numpy>=1.20",
]

# Extras are user-facing features. Developer tooling lives in
# [dependency-groups] below, so it stays out of published metadata.
[project.optional-dependencies]
virtualizarr = ["virtualizarr>=2.0"]

# zarr capped at <3.2: virtualizarr imports zarr.core.metadata.v3.RegularChunkGrid,
# which was removed in zarr 3.2.0. Remove cap when virtualizarr supports zarr 3.2+.
#
# pyarrow is a runtime dependency of Kerchunk Parquet tile indexes, not a dev tool,
# and nothing supplies it transitively: zarr requires none, fsspec only under its
# arrow/full/hdfs extras, virtualizarr names fastparquet instead.
zarr = [
    "zarr>=3.0,<3.2",
    "fsspec",
    "pyarrow>=14.0",
]

docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "sphinx-autodoc-typehints",
    "sphinxcontrib-mermaid",
    "furo",
]

# PEP 735 dependency groups — developer tooling, installed with
# `pip install -e . --group dev`. These are deliberately NOT extras: nothing a
# consumer installs should pull a test runner, and groups stay out of the
# published wheel metadata.
[dependency-groups]
# Everything needed to run the full suite with nothing silently skipped. The
# optional-feature gates are pulled via the extras rather than restated, so a
# version can never drift between the two declarations.
#
# The zarr/virtualizarr surface is guarded by `pytest.importorskip`, so omitting
# any of these does not fail — it *skips*, which reads as a green run over code
# that never executed. `pytest -rs` shows what skipped and why; a skip count
# above the handful of intentional ones means a gate is missing here.
test = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.0",
    "pyyaml>=6.0",
    "hypothesis>=6.0",
    "osml-imagery-io[zarr]",
    "osml-imagery-io[virtualizarr]",
    "xarray>=2024.1",       # tests/property/zarr/test_v3_producer.py
]

lint = ["ruff>=0.1"]

dev = [
    {include-group = "test"},
    {include-group = "lint"},
    "maturin>=1.7",
]

[project.urls]
Homepage = "https://github.com/awslabs/osml-imagery-io"
Repository = "https://github.com/awslabs/osml-imagery-io"

# Native zarr v3 pipeline: zarr.open / xarray resolve codecs by URI from this group.
[project.entry-points."zarr.codecs"]
"https://awslabs.github.io/osml-imagery-io/codecs/jpeg2000" = "aws.osml.io.zarr_codecs:Jpeg2000Codec"
"https://awslabs.github.io/osml-imagery-io/codecs/jpeg" = "aws.osml.io.zarr_codecs:JpegCodec"
"https://awslabs.github.io/osml-imagery-io/codecs/jbp-block" = "aws.osml.io.zarr_codecs:JbpBlockCodec"
"https://awslabs.github.io/osml-imagery-io/codecs/tiff-tile" = "aws.osml.io.zarr_codecs:TiffTileCodec"
"https://awslabs.github.io/osml-imagery-io/codecs/dted" = "aws.osml.io.zarr_codecs:DtedTileCodec"

# numcodecs / Kerchunk v2 path: `.zarray` filters name codecs by their `id`, which
# numcodecs resolves from its own entry-point group — it does not read zarr.codecs
# above. Without this group a v2 read raises UnknownCodecError unless the consumer
# imports aws.osml.io.zarr_codecs first (importing aws.osml.io is not enough, since
# nothing in the package imports the codec module eagerly). The keys match each
# codec's `codec_id`, which is what `get_config()` writes into the index.
[project.entry-points."numcodecs.codecs"]
"https://awslabs.github.io/osml-imagery-io/codecs/jpeg2000" = "aws.osml.io.zarr_codecs:Jpeg2000Codec"
"https://awslabs.github.io/osml-imagery-io/codecs/jpeg" = "aws.osml.io.zarr_codecs:JpegCodec"
"https://awslabs.github.io/osml-imagery-io/codecs/jbp-block" = "aws.osml.io.zarr_codecs:JbpBlockCodec"
"https://awslabs.github.io/osml-imagery-io/codecs/tiff-tile" = "aws.osml.io.zarr_codecs:TiffTileCodec"
"https://awslabs.github.io/osml-imagery-io/codecs/dted" = "aws.osml.io.zarr_codecs:DtedTileCodec"

[tool.maturin]
python-source = "python"
module-name = "aws.osml.io._io"
features = ["extension-module", "openjpeg", "libjpeg-turbo", "libtiff"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring integration data",
    "benchmark: marks benchmark tests",
    "property: marks property-based tests (run with pytest -m property)",
]
